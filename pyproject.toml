[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athp"
version = "0.1.0"
description = "Agent Test Harness Protocol reference implementation and client"
requires-python = ">=3.10"

[project.scripts]
athp = "athp.cli:main"

[tool.setuptools.packages.find]
include = ["athp*"]

